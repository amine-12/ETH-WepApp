name: Tests et production

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Compilation
        run: npm run build
      - name: Tests unitaires et SQL
        run: npm test
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Parcours navigateur
        run: npx playwright test
      - name: Préparer la base locale de test
        run: |
          cp .dev.vars.example .dev.vars
          npm run db:local
      - name: API et statistiques avec D1 local
        run: npm run test:cloudflare
      - name: Conserver les diagnostics en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-tests
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Production
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://ia-ethique.pages.dev
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Vérifier la configuration GitHub
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Secret CLOUDFLARE_API_TOKEN manquant'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Secret CLOUDFLARE_ACCOUNT_ID manquant'; exit 1; }
      - name: Appliquer les migrations puis publier
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npm run build
          npx wrangler d1 migrations apply ANALYTICS_DB --remote
          npx wrangler pages deploy dist --project-name ia-ethique --branch main
